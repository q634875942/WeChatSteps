name: 刷步数

on:
  workflow_dispatch:
  schedule:
    - cron: '00 12 * * *'
      timezone: 'Asia/Shanghai'

permissions:
  contents: read

env:
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: 初始化Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: 安装依赖并检查登录协议
        run: |
          python -m pip install -r requirements.txt
          python -m unittest -v
      - name: 开始
        env:
          PUSH_MODE: ${{ secrets.PMODE }}
          PUSH_KEY: ${{ secrets.PKEY }}
          MI_USER: ${{ secrets.USER }}
          MI_PASSWORD: ${{ secrets.PWD }}
          MI_STEP: ${{ secrets.STEP }}
        run: |
          python main.py "$PUSH_MODE" "$PUSH_KEY" "$MI_USER" "$MI_PASSWORD" "$MI_STEP"
